[package]
name = "codem37_vault_core"
version = "0.1.0"
edition = "2021"

[dependencies]
cxx = "1.0"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["staticlib", "rlib"]
