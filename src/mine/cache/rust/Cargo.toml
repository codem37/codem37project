[package]
name = "codem37-cache-core"
version = "0.1.0"
edition = "2021"
authors = ["The codem37 Authors"]
license = "BSD-3-Clause"

[dependencies]
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }

[build-dependencies]
cxx-build = "1.0"
